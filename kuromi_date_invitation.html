<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>约会邀请 💌</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden; /* 防止按钮逃跑时引起页面滚动 */
            touch-action: none;
        }

        /* Neo-brutalism 逃跑按钮的平滑动画 */
        .runaway-transition {
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 表单验证错误时的抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 自定义下拉框箭头样式以匹配库洛米暗黑新粗野风格 */
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1em;
        }
        
        /* 日期选择器的图标美化 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* 页面漂浮装饰动画 */
        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-15deg); }
        }
        .animate-float-1 { animation: float1 6s ease-in-out infinite; }
        .animate-float-2 { animation: float2 8s ease-in-out infinite; }
        .animate-float-3 { animation: float1 7s ease-in-out infinite 1s; }
        .animate-float-4 { animation: float2 9s ease-in-out infinite 2s; }
    </style>
</head>

<body id="bg-body" class="bg-[#f0e6ff] min-h-screen flex items-center justify-center relative selection:bg-[#d18cee] transition-colors duration-700">

    <!-- 页面周围的漂浮装饰 -->
    <div id="decorations" class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
        <div class="absolute top-[10%] left-[8%] text-4xl animate-float-1 opacity-70">🦇</div>
        <div class="absolute top-[12%] right-[10%] text-5xl animate-float-2 opacity-80">🎀</div>
        <div class="absolute top-[40%] left-[5%] text-3xl animate-float-3 opacity-60">💀</div>
        <div class="absolute bottom-[20%] left-[12%] text-4xl animate-float-4 opacity-70">🖤</div>
        <div class="absolute bottom-[15%] right-[12%] text-5xl animate-float-1 opacity-80">🦇</div>
        <div class="absolute top-[35%] right-[6%] text-3xl animate-float-2 opacity-60">✨</div>
        <div class="absolute bottom-[5%] left-[45%] text-2xl animate-float-3 opacity-70">🎀</div>
        <div class="absolute top-[6%] left-[40%] text-3xl animate-float-4 opacity-50">✨</div>
        <div class="absolute top-[60%] right-[18%] text-2xl animate-float-1 opacity-60">💀</div>
        <div class="absolute top-[70%] left-[25%] text-3xl animate-float-2 opacity-70">🖤</div>
    </div>

    <!-- 主卡片容器 -->
    <div id="card" class="bg-white rounded-3xl border-4 border-black shadow-[8px_8px_0px_#000000] p-8 sm:p-10 w-[92%] max-w-[420px] text-center z-10 transition-all duration-400 flex flex-col items-center mx-auto relative">
        <!-- 初始内容由 JS 注入 -->
    </div>

    <script>
        const card = document.getElementById('card');
        const bgBody = document.getElementById('bg-body');
        
        // 全局变量保存用户选择的时间
        let selectedDate = '';
        let selectedTime = '';

        // 生成时间选项 (12:00 - 20:00, 半小时跨度)
        function generateTimeOptions() {
            let options = '<option value="" disabled selected>选个时间</option>';
            for (let h = 12; h <= 20; h++) {
                const hour = h.toString().padStart(2, '0');
                options += `<option value="${hour}:00">${hour}:00</option>`;
                if (h !== 20) {
                    options += `<option value="${hour}:30">${hour}:30</option>`;
                }
            }
            return options;
        }

        // 通用的紫心头像组件 (融入库洛米元素，替换为黑心与粉色背景)
        const sealAvatarHTML = `
            <div class="relative w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-6">
                <!-- 库洛米标志性蝴蝶结装饰 -->
                <div class="absolute -top-4 -right-4 text-4xl z-20 rotate-12 drop-shadow-md">🎀</div>
                <div class="absolute -bottom-2 -left-3 text-2xl z-20 -rotate-12 opacity-80">🦇</div>
                
                <div class="w-full h-full rounded-3xl border-4 border-black shadow-[4px_4px_0px_#000000] bg-[#ffb3d9] relative z-10 flex items-center justify-center text-6xl sm:text-7xl select-none">
                    🖤
                </div>
            </div>
        `;

        const state1 = `
            ${sealAvatarHTML}
            
            <h1 class="text-2xl sm:text-[1.7rem] font-black text-black tracking-wide mb-3">可以和我一起约会吗？</h1>
            
            <div class="text-2xl mb-2 flex gap-2 justify-center">
                <span>🥺</span>
                <span>🫶</span>
            </div>
            <p class="text-[13px] font-bold text-gray-500 mb-10 tracking-widest">装作不在意，其实很期待</p>
            
            <div class="flex flex-row justify-center gap-4 sm:gap-5 w-full relative h-14 items-center">
                <!-- 库洛米紫红色按钮 -->
                <button id="yes-btn" class="bg-[#d18cee] text-black text-sm sm:text-base font-black py-3 px-6 sm:px-8 rounded-full border-4 border-black shadow-[6px_6px_0px_#000000] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[4px_4px_0px_#000000] active:translate-y-[6px] active:translate-x-[6px] active:shadow-none transition-all z-20 whitespace-nowrap">
                    愿意 🖤
                </button>
                <button id="no-btn" class="runaway-transition bg-white text-black text-sm sm:text-base font-black py-3 px-5 sm:px-6 rounded-full border-4 border-black shadow-[6px_6px_0px_#000000] z-20 whitespace-nowrap">
                    不要 no no no
                </button>
            </div>
        `;

        const state2 = `
            ${sealAvatarHTML}
            
            <h1 class="text-[1.3rem] sm:text-[1.5rem] font-black text-black leading-relaxed mb-2">
                等一下，<br>
                你真的点了吗？<br>
                你真的愿意吗？
            </h1>
            <div class="text-xl sm:text-2xl font-black text-black mb-4">😭？？</div>
            <p class="text-[12px] sm:text-[13px] font-bold text-gray-500 mb-8 tracking-widest">我都已经准备好你点不要了</p>
            
            <button id="next-btn" class="bg-[#d18cee] text-black text-sm sm:text-base font-black py-3 px-10 sm:px-12 rounded-full border-4 border-black shadow-[6px_6px_0px_#000000] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[4px_4px_0px_#000000] active:translate-y-[6px] active:translate-x-[6px] active:shadow-none transition-all z-20">
                好啦好啦 →
            </button>
        `;

        const state3 = `
            <div class="absolute -top-6 -left-4 text-4xl z-20 -rotate-12 drop-shadow-md">🎀</div>
            
            <h1 class="text-xl sm:text-2xl font-black text-black tracking-wide mb-8 mt-4">所以什么时候能见到你？</h1>
            
            <div class="w-full flex flex-col gap-5 mb-4 text-left">
                <div class="flex flex-row justify-between gap-3 sm:gap-4">
                    
                    <!-- 日期选择 -->
                    <div class="w-1/2 flex flex-col">
                        <label class="text-xs sm:text-sm font-bold text-black mb-2 pl-1">📅 见面日期</label>
                        <input type="date" id="date-input" class="w-full bg-white border-4 border-black rounded-xl px-2 sm:px-3 py-2.5 text-sm sm:text-base font-bold text-black focus:outline-none focus:ring-0 focus:border-[#d18cee] shadow-[4px_4px_0px_#000000] transition-colors" min="${new Date().toISOString().split('T')[0]}">
                    </div>
                    
                    <!-- 时间选择 -->
                    <div class="w-1/2 flex flex-col">
                        <label class="text-xs sm:text-sm font-bold text-black mb-2 pl-1">🕒 见面时间</label>
                        <select id="time-input" class="custom-select w-full bg-white border-4 border-black rounded-xl px-2 sm:px-3 py-2.5 text-sm sm:text-base font-bold text-black focus:outline-none focus:ring-0 focus:border-[#d18cee] shadow-[4px_4px_0px_#000000] transition-colors cursor-pointer">
                            ${generateTimeOptions()}
                        </select>
                    </div>
                </div>
                
                <p class="text-[11px] sm:text-xs font-bold text-gray-500 text-center mt-2 flex items-center justify-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-black"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    中午 12:00 到晚上 20:00，都等你
                </p>
            </div>
            
            <!-- 错误提示 -->
            <p id="error-msg" class="text-[#ff3b3b] font-bold text-xs sm:text-sm h-6 mb-2 opacity-0 transition-opacity">请先选好日期和时间哦！🦇</p>
            
            <button id="confirm-btn" class="w-full bg-[#d18cee] text-black text-sm sm:text-base font-black py-3 sm:py-3.5 rounded-2xl border-4 border-black shadow-[6px_6px_0px_#000000] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[4px_4px_0px_#000000] active:translate-y-[6px] active:translate-x-[6px] active:shadow-none transition-all z-20">
                确定时间 →
            </button>
        `;

        const state4 = `
            <div class="absolute -top-6 right-4 text-4xl z-20 rotate-12 drop-shadow-md">🎀</div>
            
            <div class="animate-bounce text-6xl sm:text-7xl mb-4 mt-4">🎉</div>
            <div class="text-4xl mb-4">🥰</div>
            <h1 class="text-2xl sm:text-3xl font-black text-black mb-6">太好啦！</h1>
            
            <div class="bg-[#fdf4ff] border-4 border-black shadow-[6px_6px_0px_#000000] rounded-2xl p-5 sm:p-6 w-full mt-2 relative overflow-hidden">
                <div class="absolute -bottom-4 -right-4 text-5xl opacity-20 rotate-12">🦇</div>
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-2xl">📅</span>
                    <span id="final-date" class="text-lg sm:text-xl font-black text-black border-b-4 border-[#d18cee] pb-1"></span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🕒</span>
                    <span id="final-time" class="text-lg sm:text-xl font-black text-black border-b-4 border-[#d18cee] pb-1"></span>
                </div>
            </div>
            
            <p class="text-black font-black text-[15px] sm:text-[16px] tracking-widest mt-8 bg-[#d18cee] px-6 py-2 rounded-full border-4 border-black shadow-[4px_4px_0px_#000000]">
                期待我们的约会 🖤
            </p>
        `;

        function transitionTo(stateHTML, bindEventsCallback) {
            // 缩小并淡出
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                // 替换内容
                card.innerHTML = stateHTML;
                // 绑定新页面的事件
                if (bindEventsCallback) bindEventsCallback();
                
                // 恢复缩放并淡入
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
            }, 300);
        }

        function initState1() {
            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            
            // 按钮逃跑逻辑
            function moveButton() {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                // 控制逃跑范围，确保不仅不会跑出屏幕，也不会跑出可视区域中心太远
                const maxMoveX = Math.min(windowWidth * 0.3, 140);
                const maxMoveY = Math.min(windowHeight * 0.3, 140);

                const randomX = (Math.random() - 0.5) * maxMoveX * 2;
                const randomY = (Math.random() - 0.5) * maxMoveY * 2;
                
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }

            noBtn.addEventListener('mouseover', moveButton);
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });

            yesBtn.addEventListener('click', () => {
                transitionTo(state2, initState2);
            });
        }

        function initState2() {
            const nextBtn = document.getElementById('next-btn');
            nextBtn.addEventListener('click', () => {
                transitionTo(state3, initState3);
            });
        }

        function initState3() {
            const confirmBtn = document.getElementById('confirm-btn');
            const dateInput = document.getElementById('date-input');
            const timeInput = document.getElementById('time-input');
            const errorMsg = document.getElementById('error-msg');

            confirmBtn.addEventListener('click', () => {
                // 移除动画类以便可以重复触发
                confirmBtn.classList.remove('animate-shake');
                
                if (!dateInput.value || !timeInput.value) {
                    // 强制重绘，触发错误抖动动画
                    void confirmBtn.offsetWidth; 
                    confirmBtn.classList.add('animate-shake');
                    errorMsg.style.opacity = '1';
                    
                    // 将未填项的边框标红
                    if(!dateInput.value) dateInput.classList.replace('border-black', 'border-[#ff3b3b]');
                    if(!timeInput.value) timeInput.classList.replace('border-black', 'border-[#ff3b3b]');
                    
                    setTimeout(() => {
                        errorMsg.style.opacity = '0';
                        dateInput.classList.replace('border-[#ff3b3b]', 'border-black');
                        timeInput.classList.replace('border-[#ff3b3b]', 'border-black');
                    }, 2500);
                } else {
                    // 验证成功，保存数据并进入最终页
                    selectedDate = dateInput.value;
                    selectedTime = timeInput.value;
                    
                    // 改变背景颜色，增加氛围感
                    bgBody.classList.replace('bg-[#f0e6ff]', 'bg-[#ffebf0]');
                    transitionTo(state4, initState4);
                }
            });
            
            // 用户操作时清除红框
            dateInput.addEventListener('change', () => dateInput.classList.replace('border-[#ff3b3b]', 'border-black'));
            timeInput.addEventListener('change', () => timeInput.classList.replace('border-[#ff3b3b]', 'border-black'));
        }

        function initState4() {
            const finalDateEl = document.getElementById('final-date');
            const finalTimeEl = document.getElementById('final-time');
            
            // 格式化日期显示为 YYYY年MM月DD日
            const dateObj = new Date(selectedDate);
            const formattedDate = `${dateObj.getFullYear()}年${String(dateObj.getMonth() + 1).padStart(2, '0')}月${String(dateObj.getDate()).padStart(2, '0')}日`;
            
            finalDateEl.innerText = formattedDate;
            finalTimeEl.innerText = selectedTime;
        }

        // 页面加载完成后启动第一页
        window.onload = () => {
            card.innerHTML = state1;
            initState1();
        };
    </script>
</body>
</html>
